# Local development: no lobby world, so a flat platform is generated.
bind = "127.0.0.1:25600"
max_players = 100
coordinator_bind = "127.0.0.1:25700"
gate_api = "http://127.0.0.1:8090"
keep_loaded_radius = 4
metrics_bind = "127.0.0.1:9101"

# The web script editor. In production Caddy terminates TLS in front of it.
[web]
bind = "127.0.0.1:8081"
secure_cookies = false

# Two reports put a game on hold, so it's quick to test.
[moderation]
hold_at_reports = 2

[spawn]
x = 0.5
y = 65.0
z = 0.5
void_y = 0.0

[threads]
tokio_workers = 1
compute = 1
async_compute = 1
io = 1

[[npc]]
label = ["§e§lGame Browser", "§7Click to play"]
pos = [3.5, 65.0, 0.5]
yaw = 90.0
opens = "browser"
