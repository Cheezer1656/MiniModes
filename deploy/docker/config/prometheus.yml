# deploy/prometheus/prometheus.yml with the compose hostnames, minus node_exporter.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: minimodes-lobby
    static_configs:
      - targets: ["10.77.0.10:9101"]
        labels: { process: lobby }
  - job_name: minimodes-gamehost
    static_configs:
      - targets: ["10.77.0.11:9111"]
        labels: { process: gh-1 }
      - targets: ["10.77.0.12:9112"]
        labels: { process: gh-2 }

rule_files:
  - /etc/prometheus/minimodes-alerts.yml
